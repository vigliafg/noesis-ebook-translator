# Debian package. Build from the repository root:
#   VERSION=0.10.0 nfpm package -f packaging/linux/nfpm-deb.yaml -p deb -t dist/
name: noesis-ebook-translator
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: vigliafg <vigliafg@users.noreply.github.com>
description: |
  Desktop GUI to translate EPUB ebooks with the Ebook Translator engine.
  Preserves inline markup, links, anchors, the table of contents and images.
vendor: Noesis
homepage: https://github.com/vigliafg/noesis-ebook-translator
license: GPL-3.0-or-later
depends:
  - libc6 (>= 2.35)
  - libstdc++6
  - libgcc-s1
  - libgl1
  - libegl1
  - libxkbcommon0
  - libxkbcommon-x11-0
  - libxcb-cursor0
  - libxcb-icccm4
  - libxcb-image0
  - libxcb-keysyms1
  - libxcb-randr0
  - libxcb-render-util0
  - libxcb-shape0
  - libxcb-xinerama0
  - libxcb-xkb1
  - libx11-6
  - libdbus-1-3
  - libfontconfig1
  - libfreetype6
  - libnss3
  - libnspr4
  - libasound2 | libasound2t64
  - libcups2
  - libdrm2
  - libgbm1
  - libpango-1.0-0
  - libcairo2
  - libxcomposite1
  - libxdamage1
  - libxrandr2
  - libxtst6
  - libxi6
  - libsm6
  - libice6
contents:
  - src: dist/NoesisEbookTranslator
    dst: /usr/lib/noesis-ebook-translator
  - src: /usr/lib/noesis-ebook-translator/NoesisEbookTranslator
    dst: /usr/bin/noesis-ebook-translator
    type: symlink
  - src: packaging/linux/noesis-ebook-translator.desktop
    dst: /usr/share/applications/noesis-ebook-translator.desktop
  - src: assets/linux/hicolor/256x256/apps/noesis-ebook-translator.png
    dst: /usr/share/icons/hicolor/256x256/apps/noesis-ebook-translator.png
  - src: packaging/linux/noesis-ebook-translator.metainfo.xml
    dst: /usr/share/metainfo/com.vigliafg.noesis-ebook-translator.metainfo.xml
  - src: LICENSE
    dst: /usr/share/doc/noesis-ebook-translator/LICENSE
  - src: THIRD_PARTY_NOTICES.md
    dst: /usr/share/doc/noesis-ebook-translator/THIRD_PARTY_NOTICES.md
  - src: LICENSES
    dst: /usr/share/doc/noesis-ebook-translator/LICENSES
deb:
  compression: xz
