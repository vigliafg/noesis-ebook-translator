name: docs

# Build the 5-language help site (MkDocs Material + mkdocs-static-i18n) and
# publish it to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          # Pinned: a newer plugin can introduce strict-mode warnings that fail
          # the build (the language switcher/lunr messages we hit with 1.3.1).
          pip install "mkdocs==1.6.1" "mkdocs-material==9.8.0" \
            "mkdocs-static-i18n==1.3.1" "lunr[languages]"

      - name: Build site
        working-directory: docs/site
        run: mkdocs build --strict --site-dir ../_site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_site
          publish_branch: gh-pages
